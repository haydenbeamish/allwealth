name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 20
      # Restore node_modules whole and skip npm ci on a hit. Keyed on the
      # lockfile and the exact Node version so native modules never cross ABIs.
      - name: Cache node_modules
        id: deps
        uses: actions/cache@v6
        with:
          path: node_modules
          key: deps-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.laserbeamcapital.com/api
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
